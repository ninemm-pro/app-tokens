# Checks every pull request to the lists (scripts/check_list.py). Most come from outside projects'
# forks, so it needs no secrets and only reads. Python's standard library only: nothing to install.
name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lists:
    name: The lists pass
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts
      - run: python3 scripts/check_list.py "origin/$BASE"
        env:
          BASE: ${{ github.base_ref }}
